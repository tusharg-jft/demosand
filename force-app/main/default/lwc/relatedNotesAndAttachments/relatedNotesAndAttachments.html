<template>
    <lightning-card title="Related Notes and Attachments" icon-name="doctype:attachment">
        <template if:true={records.length}>
            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                <thead>
                    <tr>
                        <th scope="col">Title</th>
                        <th scope="col">Size</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={records} for:item="record">
                        <tr key={record.ContentDocumentId}>
                            <td>{record.ContentDocument.Title}</td>
                            <td>{record.ContentDocument.LatestPublishedVersion.ContentSize} bytes</td>
                            <td>
                                <lightning-button label="Open" onclick={handleOpen} data-id={record.ContentDocumentId}></lightning-button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </template>
        <template if:false={records.length}>
            <p class="slds-p-around_medium">No Notes or Attachments found.</p>
        </template>
    </lightning-card>
</template>
