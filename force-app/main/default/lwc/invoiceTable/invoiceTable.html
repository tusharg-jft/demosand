  <!-- Related Invoices Section -->
  <div style="border: 1px solid #D8D8D8; border-radius: 5px;">
    <article class="slds-card">
      <!-- Header -->
      <div class="slds-card__header slds-grid">
        <header class="slds-media slds-media_center slds-has-flexi-truncate">
          <div class="slds-media__body">
            <h2 class="slds-card__header-title">
              <div class="slds-card__header slds-truncate" title="Related Invoices">
                <div class="slds-m-left_small slds-m-top_medium">
                  <lightning-icon icon-name="standard:expense_report" size="small"></lightning-icon>
                  <span class="slds-m-left_small" style="font-weight: bold">Related Invoices</span>
                </div>
              </div>
            </h2>
          </div>
        </header>
      </div>

      <!-- Custom Table -->
      <div class="slds-scrollable">
        <template if:true={invoices.data}>
          <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
            <thead>
              <tr class="slds-line-height_reset">
                <th class="slds-text-title_caps" scope="col">
                  <div class="slds-truncate">#</div>
                </th>
                <th class="slds-text-title_caps" scope="col">
                  <div class="slds-truncate">Invoice Name1</div>
                </th>
                <th class="slds-text-title_caps" scope="col">
                  <div class="slds-truncate">Status</div>
                </th>
                <th class="slds-text-title_caps" scope="col">
                  <div class="slds-truncate">Net Total</div>
                </th>
                <th class="slds-text-title_caps" scope="col">
                  <div class="slds-truncate">Total Discount</div>
                </th>
                <th class="slds-text-title_caps" scope="col">
                  <div class="slds-truncate">Grand Total</div>
                </th>
                <th class="slds-text-title_caps" scope="col">
                  <div class="slds-truncate">Actions</div>
                </th>
              </tr>
            </thead>
            <tbody>
              <template for:each={invoices.data} for:item="invoice" for:index="index">
                <tr key={invoice.Id} class="slds-hint-parent slds-p-vertical_x-small" data-id={invoice.Id} onclick={handleRowSelection}>
                  <td><div class="slds-truncate">{invoice.rowNumber}</div></td>
                  <td><div class="slds-truncate"><a href={invoice.recordLink} target="_blank">{invoice.Name}</a></div></td>
                  <td><div class="slds-truncate">{invoice.Status__c}</div></td>
                  <td><div class="slds-truncate">₹{invoice.netTotal__c}</div></td>
                  <td><div class="slds-truncate">₹{invoice.totalDiscount__c}</div></td>
                  <td><div class="slds-truncate">₹{invoice.grandTotal__c}</div></td>
                
                  <!-- 🔘 Actions column -->
                  <td>
                    <div class="slds-button-group" role="group">
                
                        <c-upsert-invoice-button 
                          type="edit" 
                          rec={recordId}
                          passedestimateid={invoice.Id} 
                          >
                        </c-upsert-invoice-button>
                    
                        <lightning-button 
                    label='Submit For Approval'
                    data-id={invoiceid}
                    onclick={handleSubmitInvoiceApproval}>
                    </lightning-button>
                    
                        <lightning-button
                          variant="neutral"
                          label="View PDF"
                          data-id={invoice.Id}
                          onclick={handleOpenInvoiceModal}
                          class="slds-m-left_x-small"
                        ></lightning-button>
                    </div>
                  </td>
                </tr>
                
              </template>
            </tbody>
          </table>
        </template>
        
        <template if:true={invoices.error}>
          <p class="slds-text-color_error slds-p-around_medium">{invoices.error}</p>
        </template>
      </div>
    </article>
  </div>
</template>
