<template>


  <div style="border: 1px solid #D8D8D8; border-radius: 5px;">
  <article class="slds-card">
    <!-- Header -->
    <div class="slds-card__header slds-grid">
      <header class="slds-media slds-media_center slds-has-flexi-truncate">
        <div class="slds-media__body">
          <h2 class="slds-card__header-title">
            <div class="slds-m-left_small slds-m-top_medium slds-truncate" title="Contact">
                <lightning-icon icon-name="standard:expense_report" size="small"></lightning-icon>
                <span class="slds-m-left_small" style="font-weight: bold;">Related Invoice</span>
            </div>
        </h2>
 </div>
       
      
      <div  class="slds-m-around_medium">
        <c-upsert-invoice-button 
          type="add" 
          rec={recordId}>
        </c-upsert-invoice-button>
      </div>
    </header>
    </div>

    <!-- Custom Table -->
    <div class="slds-scrollable_x">
      <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
        <thead>
          <tr>
            <th scope="col"><div class="slds-truncate slds-text-align_center">Invoice Name</div></th>
            <th scope="col"><div class="slds-truncate slds-text-align_center">Status</div></th>
            <th scope="col" class="slds-text-align_center"><div class="slds-truncate">Net Total</div></th>
            <th scope="col" class="slds-text-align_center"><div class="slds-truncate">Total Discount</div></th>
            <th scope="col" class="slds-text-align_center"><div class="slds-truncate">Grand Total</div></th>
            <th scope="col"><div class="slds-truncate">Actions</div></th>
          </tr>
        </thead>
        <tbody>
          <template for:each={invoices.data} for:item="invoice">
            <tr key={invoice.Id} data-id={invoice.Id}>
              <td>
                <a href="javascript:void(0);" onclick={handleOpenInvoiceModal} data-id={invoice.Id} class="slds-text-link_bare slds-text-title_bold">
                  {invoice.Name}
                </a>
              </td>
              <td><div class="slds-text-align_center">{invoice.Status__c}</div></td>
              <td><div class="slds-text-align_center">₹{invoice.netTotal__c}</div></td>
              <td><div class="slds-text-align_center">₹{invoice.totalDiscount__c}</div></td>
              <td><div class="slds-text-align_center">₹{invoice.grandTotal__c}</div></td>
              <td>
                <div class="slds-button-group" role="group">
                  <template if:false={invoice.showviewinvoice}>
                    <c-upsert-invoice-button
                      class="slds-m-right_small"
                      rec={recordId}
                      passedinvoiceid={invoice.Id}
                      type="edit">
                    </c-upsert-invoice-button>
                  </template>

                  <template if:true={invoice.isPending}>
                    <lightning-button
                      label="Submit For Approval"
                      data-id={invoice.Id}
                      onclick={handleSubmitInvoiceApproval}>
                    </lightning-button>
                  </template>

                  <template if:true={invoice.showviewinvoice}>
                    <lightning-button
                      label="View Invoice"
                      data-id={invoice.Id}
                      onclick={handleOpenInvoiceModal}>
                    </lightning-button>
                  </template>
                </div>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </article>
  </div>

  <!-- Modal for PDF -->
  <template if:true={isInvoiceModalOpen}>
    <section role="dialog" class="slds-modal slds-fade-in-open slds-modal_large">
      <div class="slds-modal__container" style="width:65%">
        <header class="slds-modal__header">
          <button class="slds-button slds-modal__close" onclick={handleCloseModal}>
            <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
          </button>
          <h2 class="slds-text-heading_medium">Invoice PDF</h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium" style="height: 80vh;">
          <iframe src={invoicePdfUrl} width="100%" height="100%" frameborder="0"></iframe>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
