<template>
    <div class="slds-grid slds-gutters">
        <template for:each={dashboardData} for:item="data">
            <template if:true={data.count}>
                <div key={data.title} class="slds-col slds-size_1-of-6 slds-p-around_small hover:scale-105">
                    <lightning-card icon-name={data.icon}>
                        <div slot="title" class="slds-text-heading_small slds-line-clamp_small" title={data.title}>
                            {data.title}
                        </div>
                        <div class="slds-text-align_center slds-p-around_x-small">
                            <p class="slds-text-heading_medium slds-text-color_default">{data.count}</p>
                        </div>
                        <footer class="slds-text-align_center slds-p-around_xx-small">
                            <a href="javascript:void(0)" class="slds-text-link" onclick={data.handler}>
                                View all
                            </a>
                        </footer>
                    </lightning-card>
                </div>
            </template>
        </template>
    </div>
</template>
