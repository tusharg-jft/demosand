<template>
    <lightning-card title="Vendor Work Orders">
        <template if:true={vendorWoRecords}>
            <lightning-datatable
                data={vendorWoRecords}
                columns={columns}
                key-field="Id">

        </template>

            <div class="slds-text-color_error">{error}</div>
        </template>
    </lightning-card>
</template>
