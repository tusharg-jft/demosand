<template>
    <template for:each={formDataSections} for:item="formGroup">
      <div key={formGroup.type} class="form-group">  
        <lightning-accordion allow-multiple-sections-open active-section-name={formGroup.type}>
          <template for:each={formGroup.sections} for:item="section">
            <lightning-accordion-section key={section.Label} name={section.Label} label={section.Label}>
              <!-- Loop through rows -->
              <template for:each={section.Fields} for:item="fieldRow" for:index="index">
                <div key={section} class="estimate-row slds-grid slds-wrap slds-gutters slds-m-bottom_x-small">
                  <!-- Loop through individual fields in each row -->
                  <template for:each={fieldRow} for:item="field">
                    <div key={field.fieldLabel} class="slds-col slds-p-around_x-small">
                      <label class="slds-form-element__label">
                        {field.fieldLabel}
                        <template if:true={field.required}>
                          <abbr class="slds-required" title="required">*</abbr>
                        </template>
                      </label>
  
                      <!-- Picklist -->
                      <template if:true={field.isPicklist}>
                        <lightning-combobox
                          name="picklist"
                          data-label={section.Label}
                          data-index={index}
                          data-field={field.fieldLabel}
                          value={field.value}
                          placeholder="Select an option"
                          options={options}
                          onchange={handleInputChangePicklist}>
                        </lightning-combobox>
                      </template>
  
                      <!-- Regular input -->
                      <template if:false={field.isPicklist}>
                        <lightning-input
                          data-label={section.Label}
                          data-index={index}
                          data-field={field.fieldLabel}
                          class="slds-m-top_xx-small"
                          type={field.inputType}
                          required={field.required}
                          disabled={field.isDisabled}
                          onchange={handleInputChangeInputbox}
                          value={field.value}>
                        </lightning-input>
                      </template>
                    </div>
                  </template>
  
                  <!-- Delete Button -->
                  <div class="slds-col slds-p-around_x-small slds-align-bottom slds-m-left_auto">
                    <lightning-button
                      label="Delete"
                      variant="destructive"
                      onclick={handleDeleteField}
                      data-label={section.Label}
                      data-index={index}>
                    </lightning-button>
                  </div>
                </div>
              </template>
  
              <!-- Add Button -->
              <div class="slds-grid">
                <div class="slds-m-left_auto">
                  <lightning-button
                    label="Add"
                    onclick={handleAddField}
                    data-label={section.Label}
                    class="slds-m-bottom_small">
                  </lightning-button>
                </div>
              </div>
            </lightning-accordion-section>
          </template>
        </lightning-accordion>
      </div>
    </template>
  </template>
