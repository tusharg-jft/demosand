<template>
    <div style="border: 1px solid #D8D8D8; border-radius: 5px;">
        <article class="slds-card">
            <!-- Header -->
            <div class="slds-card__header slds-grid slds-grid_align-spread slds-p-around_small">
                <div class="slds-media slds-media_center slds-p-around_medium">
                    <lightning-icon icon-name="standard:invoice" size="small"></lightning-icon>
                    <span class="slds-m-left_small" style="font-weight: bold">Related Invoices</span>
                </div>

                <!-- Filters -->
                <div class="slds-grid slds-grid_align-end slds-p-around_medium" style="gap: 1rem;">
                    <lightning-combobox
                        name="vendorFilter"
                        label="Filter by Vendor"
                        value={selectedVendor}
                        options={vendorOptions}
                        onchange={handleVendorChange}>
                    </lightning-combobox>

                    <lightning-combobox
                        name="statusFilter"
                        label="Filter by Status"
                        value={selectedStatus}
                        options={statusOptions}
                        onchange={handleStatusChange}>
                    </lightning-combobox>
                </div>
            </div>

            <!-- Data Table -->
            <div class="slds-scrollable_y" style="max-height: 400px;">
                <lightning-datatable
                    key-field="invoiceId"
                    data={filteredInvoices}
                    columns={columns}
                    show-row-number-column
                    hide-checkbox-column
                    onrowaction={handleRowAction}>
                </lightning-datatable>
            </div>



            <template if:true={showModal}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container" style="width: 60%; max-width: 60%;">
                        <header class="slds-modal__header">
                            <h2 class="slds-text-heading_medium">Invoice Preview</h2>
                            <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={closeModal}>
                                <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                            </button>
                        </header>
                        <div class="slds-modal__content" style="height: 80vh;">
                            <iframe src={selectedInvoiceUrl} width="100%" height="100%" frameborder="0"></iframe>
                        </div>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

            

        </article>
    </div>
</template>
