<template>
  <c-add-edit-button-version-one class="slds-m-around_medium" rec={recordId} type="add"></c-add-edit-button-version-one>
  <lightning-card title="Related Estimates" icon-name="standard:quote">
    <template if:true={estimates.data}>
      <table class="slds-table slds-table_cell-buffer slds-table_bordered">
        <thead>
          <tr>
            <th>Estimate Name</th>
            
            <th>Status</th>
            <th>Estimate Data</th>
            <th>Estimate Actions</th> 
            <th>Invoice Actions</th><!-- New column -->
          </tr>
        </thead>
        <tbody>
          <template if:true={firstEstimate}>
            <tr>
              <td>
                <a href={firstEstimate.recordLink} target="_blank">{firstEstimate.Name}</a>
              </td>
            
              <td>{firstEstimate.Status__c}</td>
              <td>
                <a href="javascript:void(0);" data-record-id={firstEstimate.Id} onclick={handleEstimateDataClick}>
                  {firstEstimate.estimateDataLabel}
                </a>
              </td>
              <td>
                <lightning-button
                  variant="brand"
                  label={firstEstimate.submitLabel}
                  data-id={firstEstimate.Id}
                  onclick={handleSubmitApproval}>
                </lightning-button>
              </td>
              <td>
                <c-add-edit-button-version-one class="slds-m-around_medium" rec={recordId} type="edit"></c-add-edit-button-version-one>
   
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </template>

  
  </lightning-card>

</template>
