<template>
    <lightning-card title="Estimate Viewer">
        <div class="slds-p-around_medium">
            <lightning-button 
                label="Open Estimate Form" 
                onclick={handleOpenModal} 
                variant="brand">
            </lightning-button>
        </div>

        <template if:true={isModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open custom-modal">
                <div class="slds-modal__container custom-modal-container">

                    <!-- Modal Header (no title text shown) -->
                    <header class="slds-modal__header custom-modal-header">
                        <button class="slds-button slds-modal__close" title="Close" onclick={handleCloseModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        </button>
                    </header>

                    <!-- Modal Body -->
                    <div class="slds-modal__content custom-modal-content">
                        <iframe src={vfUrl} width="100%" height="100%" frameborder="0"></iframe>
                    </div>

                    <!-- Modal Footer -->
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Close" onclick={handleCloseModal}></lightning-button>
                    </footer>

                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
