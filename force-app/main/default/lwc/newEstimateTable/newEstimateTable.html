<template>
    <div style="border: 1px solid #D8D8D8; border-radius: 5px;">
        <article class="slds-card">
            <!-- Header -->
            <div class="slds-card__header slds-grid">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title">
                            <div class="slds-card__header slds-truncate" title="Contact">
                                <div class="slds-m-left_small slds-m-top_medium">
                                    <lightning-icon icon-name="standard:contact" size="small"></lightning-icon>
                                    <span class="slds-m-left_small" style="font-weight: bold">Related Estimate</span>
                                </div>
                            </div>
                        </h2>
                    </div>

                    <!-- Add button -->
                    <div>
            <c-add-edit-button-version-one class="slds-m-around_medium" rec={recordId} type="add"></c-add-edit-button-version-one>

                    </div>
                </header>
            </div>

            <!-- Custom Table -->
            <div class="slds-scrollable">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th class="slds-text-title_caps" scope="col">
                                <div class="slds-truncate">#</div>
                            </th>
                            <th class="slds-text-title_caps" scope="col">
                                <div class="slds-truncate">Estimate Name1</div>
                            </th>
                            <th class="slds-text-title_caps" scope="col">
                                <div class="slds-truncate">Status</div>
                            </th>
                            <th class="slds-text-title_caps" scope="col">
                                <div class="slds-truncate">Net Total</div>
                            </th>
                            <th class="slds-text-title_caps" scope="col">
                                <div class="slds-truncate">Total Discount</div>
                            </th>
                            <th class="slds-text-title_caps" scope="col">
                                <div class="slds-truncate">Grand Total</div>
                            </th>
                            <th class="slds-text-title_caps" scope="col">
                                <div class="slds-truncate">Actions</div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={estimateList} for:item="estimate" for:index="index">
                            <tr key={estimate.Id} class="slds-hint-parent slds-p-vertical_x-small" data-selected={estimate.Id} data-id={estimate.Id} onclick={handleRowSelection}>
                                <td class="slds-p-around_medium">
                                    <div class="slds-truncate">{estimate.rowNumber}</div>
                                </td>
                                <td class="slds-p-around_medium">
                                    <div class="slds-truncate">{estimate.Name}</div>
                                </td>
                                <td class="slds-p-around_medium">
                                    <div class="slds-truncate">{estimate.estimateStatus}</div>
                                </td>
                                <td class="slds-p-around_medium">
                                    <div class="slds-truncate">₹{estimate.netPrice__c}
                                    </div>
                                </td>
                                <td class="slds-p-around_medium">
                                    <div class="slds-truncate">₹{estimate.totalDiscount__c}</div>
                                </td>
                                <td class="slds-p-around_medium">
                                    <div class="slds-truncate">₹{estimate.grandTotal__c}</div>
                                </td>
                                <td class="slds-p-around_medium">
                                       <div class="slds-button-group" role="group">
                                        
                                        <template if:true={estimate.isDraft}>
                                            <c-add-edit-button-version-one 
                                                class="slds-m-right_small"
                                                rec={recordId} 
                                                passedestimateid={estimate.Id} 
                                                type="edit">
                                            </c-add-edit-button-version-one>
                                        
                                            <lightning-button 
                                                label="Submit For Approval" 
                                                data-id={estimate.Id} 
                                                data-action="submitApproval"
                                                onclick={handleRowAction}>
                                            </lightning-button>
                                        </template>
                                        
                                        <template if:true={estimate.isApproved}>
                                            <lightning-button
                                                label="Create Invoice"
                                                data-id={estimate.Id}
                                                onclick={handleSubmitInvoiceApproval}>
                                            </lightning-button>
                                        </template>
                                        <template if:true={estimate.isRejected}>
                                            <c-add-edit-button-version-one 
                                            rec={recordId} 
                                            passedestimateid={estimate.Id} 
                                            type="edit">
                                        </c-add-edit-button-version-one>
                                        </template>
                                        <template if:true={estimate.isSubmitedForApproval}>
                                            <lightning-button
                                            
                          variant="neutral"
                          label="View EStimate"
                          data-id={estimate.Id}
                        ></lightning-button>

                                        </template>


                                    </div>
                                    
                                
                                    </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </article>

        <!-- Conditionally show Edit button -->
        
    </div>
</template>
