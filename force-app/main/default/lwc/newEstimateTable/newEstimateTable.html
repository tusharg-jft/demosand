<template>
    <div style="border: 1px solid #D8D8D8; border-radius: 5px;">
        <article class="slds-card">
            <!-- Header -->
            <div class="slds-card__header slds-grid">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title">
                            <div class="slds-m-left_small slds-m-top_medium slds-truncate" title="Contact">
                                <lightning-icon icon-name="standard:contact" size="small"></lightning-icon>
                                <span class="slds-m-left_small" style="font-weight: bold;">Related Estimate</span>
                            </div>
                        </h2>
                    </div>

                    <!-- Add button -->
                    <div class="slds-m-around_medium">
                        <c-add-edit-button-version-one rec={recordId} type="add"></c-add-edit-button-version-one>
                    </div>
                </header>
            </div>

            <!-- Custom Table -->
            <div class="slds-scrollable">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <!-- <th scope="col"><div class="slds-truncate">#</div></th> -->
                            <th scope="col"><div class="slds-truncate">Estimate Name</div></th>
                            <th scope="col"><div class="slds-truncate">Status</div></th>
                            <th scope="col"><div class="slds-truncate">Net Total</div></th>
                            <th scope="col"><div class="slds-truncate">Total Discount</div></th>
                            <th scope="col"><div class="slds-truncate">Grand Total</div></th>
                            <th scope="col"><div class="slds-truncate">Actions</div></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={estimateList} for:item="estimate" for:index="index">
                            <tr key={estimate.Id} class="slds-hint-parent slds-p-vertical_x-small" data-selected={estimate.Id} data-id={estimate.Id} onclick={handleRowSelection}>
                                <!-- <td class="slds-p-around_medium">
                                    <div class="slds-truncate">{estimate.Id}-{estimate.parentestimate__c}</div>
                                </td> -->
                                <td class="slds-p-around_medium">
                                    <a href="javascript:void(0);" onclick={openModal} data-id={estimate.Id}>
                                        <div class="slds-truncate slds-text-link_bare slds-text-title_bold">{estimate.Name}</div>
                                    </a>
                                </td>
                                <td class="slds-p-around_medium">
                                    <div class="slds-truncate">{estimate.estimateStatus}</div>
                                </td>
                                <td class="slds-p-around_medium">
                                    <div class="slds-truncate">₹{estimate.netPrice__c}</div>
                                </td>
                                <td class="slds-p-around_medium">
                                    <div class="slds-truncate">₹{estimate.totalDiscount__c}</div>
                                </td>
                                <td class="slds-p-around_medium">
                                    <div class="slds-truncate">₹{estimate.grandTotal__c}</div>
                                </td>
                                <td class="slds-p-around_medium">
                                    <div class="slds-button-group slds-grid slds-wrap" role="group">
                                        <template if:true={estimate.isDraft}>
                                            <c-add-edit-button-version-one
                                                class="slds-m-right_small"
                                                rec={recordId}
                                                passedestimateid={estimate.Id}
                                                type="edit">
                                            </c-add-edit-button-version-one>
                                            <lightning-button
                                                label="Submit For Approval"
                                                data-id={estimate.Id}
                                                data-action="submitApproval"
                                                onclick={handleRowAction}>
                                            </lightning-button>
                                        </template>
                                        <template if:true={estimate.isApproved}>
                                            <lightning-button
                                                label="Create Invoice"
                                                data-id={estimate.Id}
                                                onclick={handleSubmitInvoiceApproval}>
                                            </lightning-button>
                                        </template>
                                        <template if:true={estimate.isRejected}>
                                            <c-add-edit-button-version-one
                                                rec={recordId}
                                                passedestimateid={estimate.Id}
                                                type="edit">
                                            </c-add-edit-button-version-one>
                                        </template>
                                        <template if:true={estimate.showViewEstimate}>
                                            <lightning-button
                                                variant="neutral"
                                                label="View Estimate"
                                                data-id={estimate.Id}
                                                onclick={openModal} 
                                                >
                                            </lightning-button>
                                        </template>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </article>
    </div>

    <!-- MODAL for VF preview -->
    <template if:true={isModalOpen}> 
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container" style="width:65%; max-width:65%">
                <!-- Modal header -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-modal__close" onclick={closeModal} title="Close">
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">Estimate Preview</h2>
                </header>

                <!-- Modal body -->
                <div class="slds-modal__content slds-p-around_medium" style="height: 80vh;">
                    <iframe src={vfPageUrl} width="100%" height="100%" frameborder="0"></iframe>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
