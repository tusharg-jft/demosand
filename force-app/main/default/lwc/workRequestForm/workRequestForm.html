<template>
    <lightning-card title="Create Work Order" icon-name="standard:work_order">
        <div class="slds-p-around_medium">
            <!-- Error message display -->
            <template if:true={error}>
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <h2>{error}</h2>
                </div>
            </template>

            <!-- Loading spinner -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>

            <!-- Corporate and Brand Profile Form -->
            <template if:true={isCorporateOrBrandProfile}>
                <div class="slds-grid slds-gutters slds-wrap">
                    <!-- Trade Field -->
                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                        <lightning-combobox
                            name="trade"
                            label="Trade"
                            value={selectedTradeId}
                            options={tradeOptions}
                            onchange={handleTradeChange}
                            required
                        ></lightning-combobox>
                    </div>

                    <!-- Classification Field -->
                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                        <lightning-combobox
                            name="classification"
                            label="Classification"
                            value={selectedClassificationId}
                            options={classificationOptions}
                            onchange={handleClassificationChange}
                            disabled={disableClassification}
                        ></lightning-combobox>
                    </div>

                    <!-- Issue Field -->
                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                        <lightning-combobox
                            name="issue"
                            label="Issue"
                            value={selectedIssueId}
                            options={issueOptions}
                            onchange={handleIssueChange}
                            disabled={disableIssue}
                        ></lightning-combobox>
                    </div>

                    <!-- Sites Field -->
                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                        <lightning-combobox
                            name="site"
                            label="Site"
                            value={selectedSiteId}
                            options={siteOptions}
                            onchange={handleSiteChange}
                            required
                        ></lightning-combobox>
                    </div>

                    <!-- Priority Field -->
                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                        <lightning-combobox
                            name="priority"
                            label="Priority"
                            value={selectedPriority}
                            options={priorityOptions}
                            onchange={handlePriorityChange}
                            required
                        ></lightning-combobox>
                    </div>

                    <!-- Original ETA Field -->
                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                        <lightning-input
                            type="datetime"
                            name="originalEta"
                            label="Original ETA"
                            value={originalEta}
                        ></lightning-input>
                    </div>

                    <!-- Requested By Person Field -->
                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                        <lightning-input
                            type="text"
                            name="requestedByPerson"
                            label="Requested By Person"
                            value={requestedByPerson}
                            onchange={handleRequestedByPersonChange}
                        ></lightning-input>
                    </div>

                    <!-- NTE Field (Corporate Profile Only) -->
                    <template if:true={isCorporateProfile}>
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                            <lightning-input
                                type="number"
                                name="nte"
                                label="NTE"
                                value={nte}
                                formatter="currency"
                                step="0.01"
                                onchange={handleNteChange}
                                required
                            ></lightning-input>
                        </div>
                    </template>

                    <!-- Description Field -->
                    <div class="slds-col slds-size_1-of-1 slds-p-bottom_small">
                        <lightning-textarea
                            name="description"
                            label="Description"
                            value={description}
                            onchange={handleDescriptionChange}
                        ></lightning-textarea>
                    </div>
                </div>
            </template>

            <!-- Site Profile Form -->
            <template if:true={isSiteProfile}>
                <div class="slds-grid slds-gutters slds-wrap">
                    <!-- Description Field -->
                    <div class="slds-col slds-size_1-of-1 slds-p-bottom_small">
                        <lightning-textarea
                            name="description"
                            label="Description"
                            value={description}
                            onchange={handleDescriptionChange}
                            required
                        ></lightning-textarea>
                    </div>

                    <!-- Requested By Person Field -->
                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                        <lightning-input
                            type="text"
                            name="requestedByPerson"
                            label="Requested By Person"
                            value={requestedByPerson}
                            onchange={handleRequestedByPersonChange}
                            required
                        ></lightning-input>
                    </div>

                    <!-- Trade Field -->
                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                        <lightning-combobox
                            name="trade"
                            label="Trade"
                            value={selectedTradeId}
                            options={tradeOptions}
                            onchange={handleTradeChange}
                            required
                        ></lightning-combobox>
                    </div>

                        <!-- Classification Field -->
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                            <lightning-combobox
                                name="classification"
                                label="Classification"
                                value={selectedClassificationId}
                                options={classificationOptions}
                                onchange={handleClassificationChange}
                                disabled={disableClassification}
                            ></lightning-combobox>
                        </div>
    
                        <!-- Issue Field -->
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                            <lightning-combobox
                                name="issue"
                                label="Issue"
                                value={selectedIssueId}
                                options={issueOptions}
                                onchange={handleIssueChange}
                                disabled={disableIssue}
                            ></lightning-combobox>
                        </div>

                    <!-- Sites Field -->
                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                        <lightning-combobox
                            name="site"
                            label="Site"
                            value={selectedSiteId}
                            options={siteOptions}
                            onchange={handleSiteChange}
                            required
                        ></lightning-combobox>
                    </div>
                </div>
            </template>

            <!-- Form Buttons -->
            <div class="slds-m-top_medium">
                <lightning-button
                    label="Cancel"
                    onclick={handleCancel}
                    class="slds-m-right_x-small"
                ></lightning-button>
                <lightning-button
                    label="Save"
                    variant="brand"
                    onclick={handleSave}
                    disabled={isSubmitDisabled}
                ></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
