<template>
    <lightning-card title="Trade Management" icon-name="custom:custom14" class="container">
        <div class="slds-p-around_medium">
            <template for:each={trades} for:item="trade">
                <div key={trade.Id} class="trade-item">
                    <lightning-input 
                        type="checkbox" 
                        label={trade.Name} 
                        data-id={trade.Id}
                        checked={trade.isChecked}  
                        onchange={handleCheckboxChange}>
                    </lightning-input>
                </div>
            </template>

            <div class="button-group">
                <lightning-button label="Add Rate" variant="brand" onclick={handleAddTrade}></lightning-button>
                <lightning-button label="Clear Selection" variant="neutral" onclick={clearCheckboxes} class="slds-m-left_small"></lightning-button>
            </div>
        </div>
    </lightning-card>

    <!-- Modal -->
    <template if:true={showModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                
                <!-- Dynamic trade name as modal header -->
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">{selectedTradeName}</h2>
                </header>

                <!-- <div class="slds-modal__content slds-p-around_medium">
                    <template for:each={currencyFields} for:item="field">
                        <lightning-input key={field.apiName}
                                         label={field.label}
                                         data-field={field.apiName}
                                         type="number"
                                         onchange={handleCurrencyChange}>
                        </lightning-input>
                    </template>
                </div> -->

                <div class="slds-modal__content slds-p-around_medium">
                    <template for:each={currencyFields} for:item="field">
                        <div key={field.apiName} class="slds-form-element">
                            <label class="slds-form-element__label">{field.label}</label>
                            <div class="slds-input-has-fixed-addon">
                                <span class="slds-form-element__addon">$</span>
                                <lightning-input data-field={field.apiName}
                                                 type="number"
                                                 class="slds-input"
                                                 onchange={handleCurrencyChange}>
                                </lightning-input>
                            </div>
                        </div>
                    </template>
                </div>
                

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
                    <lightning-button label="Remove" onclick={clearFields} class="slds-m-left_small"></lightning-button>
                    <lightning-button label="Save" variant="brand" onclick={saveTradeRate} class="slds-m-left_small"></lightning-button>
                </footer>
            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
